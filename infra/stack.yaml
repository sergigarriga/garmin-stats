AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  garmin-stats: web privada de salud (S3 privado + CloudFront + login con Google + Lambda para chat y plan).
  Solo los emails permitidos pueden descargar cualquier archivo.

Parameters:
  AllowedEmails:
    Type: String
    Description: Emails de Google con acceso (separados por comas)
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secreto HMAC de la cookie de sesión
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Cabecera secreta que solo CloudFront envía a las Lambda
  BudgetEmail:
    Type: String
    Description: Email para el aviso de presupuesto y las alarmas
  VapidPublicKey:
    Type: String
    Description: Clave pública VAPID (notificaciones push)
  CatalogPostcode:
    Type: String
    Default: ""
    Description: Código postal de la tienda para los precios de la lista de la compra (un solo almacén por ahora; vacío = el del último catálogo)

Resources:
  # ------------------------------------------------------------------ almacenamiento
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub garmin-stats-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 3 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadSite
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/site/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub garmin-stats-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------------ login (Lambda)
  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: read-google-oauth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/garmin-stats/google-*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${SiteBucket.Arn}/admin/users.json
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn

  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: garmin-stats-auth
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: handler.handler
      Code: lambda/auth
      Role: !GetAtt AuthRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          OWNER_EMAIL: !Ref AllowedEmails
          BUCKET: !Ref SiteBucket
          SESSION_SECRET: !Ref SessionSecret
          ORIGIN_SECRET: !Ref OriginSecret
          GOOGLE_CLIENT_ID_PARAM: /garmin-stats/google-client-id
          GOOGLE_CLIENT_SECRET_PARAM: /garmin-stats/google-client-secret

  AuthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/garmin-stats-auth
      RetentionInDays: 14

  AuthUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AuthFunction.Arn
      AuthType: NONE

  AuthUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ------------------------------------------------------------------ API: chat y plan (Lambda)
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: api-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: [!Sub "${SiteBucket.Arn}/site/u/*", !Sub "${SiteBucket.Arn}/users/*", !Sub "${SiteBucket.Arn}/admin/users.json"]
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${SiteBucket.Arn}/admin/catalog/*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/garmin-stats/anthropic-key
              - Effect: Allow
                Action: [ssm:PutParameter, ssm:DeleteParameter, ssm:GetParameter]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/garmin-stats/users/*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:garmin-stats-api
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:garmin-stats-notify
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:garmin-stats-sync

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: garmin-stats-api
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: handler.handler
      Code: api
      Role: !GetAtt ApiRole.Arn
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          OWNER_EMAIL: !Ref AllowedEmails
          SESSION_SECRET: !Ref SessionSecret
          ORIGIN_SECRET: !Ref OriginSecret
          ANTHROPIC_KEY_PARAM: /garmin-stats/anthropic-key
          NOTIFY_FUNCTION: garmin-stats-notify
          SYNC_FUNCTION: garmin-stats-sync

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/garmin-stats-api
      RetentionInDays: 14

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE

  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ------------------------------------------------------------------ sincronización horaria (Lambda)
  SyncRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: sync-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: [!Sub "${SiteBucket.Arn}/site/*", !Sub "${SiteBucket.Arn}/users/*", !Sub "${SiteBucket.Arn}/admin/users.json"]
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/garmin-stats/users/*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/garmin-stats/anthropic-key
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:garmin-stats-sync
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:garmin-stats-api

  SyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: garmin-stats-sync
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: handler.handler
      Code: sync
      Role: !GetAtt SyncRole.Arn
      Timeout: 900
      MemorySize: 1024
      EphemeralStorage: { Size: 1024 }
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          API_FUNCTION: garmin-stats-api

  SyncLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/garmin-stats-sync
      RetentionInDays: 14

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: invoke-sync
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{ Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt SyncFunction.Arn }]

  HourlySync:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: garmin-stats-hourly
      Description: Sincroniza Garmin y actualiza la web cada hora
      ScheduleExpression: cron(5 * * * ? *)
      ScheduleExpressionTimezone: Europe/Madrid
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt SyncFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: { MaximumRetryAttempts: 1 }

  # ------------------------------------------------------------------ aviso de la mañana (Web Push)
  NotifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: notify-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: [!Sub "${SiteBucket.Arn}/site/u/*", !Sub "${SiteBucket.Arn}/users/*", !Sub "${SiteBucket.Arn}/admin/users.json"]
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${SiteBucket.Arn}/users/*/state/push.json
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/garmin-stats/vapid-private

  NotifyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: garmin-stats-notify
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: notify.handler
      Code: sync
      Role: !GetAtt NotifyRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          OWNER_EMAIL: !Ref AllowedEmails

  NotifyLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/garmin-stats-notify
      RetentionInDays: 14

  NotifySchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: invoke-notify
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{ Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt NotifyFunction.Arn }]

  MorningNotify:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: garmin-stats-morning
      Description: Aviso de la mañana con la preparación y la sesión del día
      ScheduleExpression: cron(30 7 * * ? *)
      ScheduleExpressionTimezone: Europe/Madrid
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt NotifyFunction.Arn
        RoleArn: !GetAtt NotifySchedulerRole.Arn

  # ------------------------------------------------------------------ catálogo de la lista de la compra (refresco semanal)
  # Con permiso de Mercadona (03-11-2026): pocas peticiones, una vez por semana. Si responde 403/429 se para (sin
  # reintentos: ni la Lambda ni el programador repiten) y la API sigue con el último catálogo bueno.
  CatalogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: catalog-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${SiteBucket.Arn}/admin/catalog/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn

  CatalogFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: garmin-stats-catalog
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: catalog_job.handler
      Code: api
      Role: !GetAtt CatalogRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          CATALOG_POSTCODE: !Ref CatalogPostcode
          CATALOG_GAP: "0.75"

  CatalogInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref CatalogFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  CatalogLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/garmin-stats-catalog
      RetentionInDays: 30

  CatalogSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: invoke-catalog
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{ Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt CatalogFunction.Arn }]

  WeeklyCatalog:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: garmin-stats-catalog-weekly
      Description: Precios de la lista de la compra (una vez por semana)
      ScheduleExpression: cron(0 5 ? * MON *)
      ScheduleExpressionTimezone: Europe/Madrid
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt CatalogFunction.Arn
        RoleArn: !GetAtt CatalogSchedulerRole.Arn
        RetryPolicy: { MaximumRetryAttempts: 0 }

  # ------------------------------------------------------------------ alarmas (email si algo falla)
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: garmin-stats-alerts
      DisplayName: Runch
      Subscription: [{ Protocol: email, Endpoint: !Ref BudgetEmail }]

  SyncErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: garmin-stats-sync-falla
      AlarmDescription: La sincronización con Garmin ha fallado 2 horas seguidas.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SyncFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  SyncStoppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: garmin-stats-sync-parada
      AlarmDescription: La sincronización no se ha ejecutado en las últimas 3 horas.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref SyncFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertsTopic]

  CatalogErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: garmin-stats-catalogo-falla
      AlarmDescription: El refresco semanal de precios de la lista de la compra ha fallado (se mantiene el catálogo anterior).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref CatalogFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  NotifyErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: garmin-stats-aviso-falla
      AlarmDescription: El aviso de la mañana ha fallado.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref NotifyFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ------------------------------------------------------------------ CloudFront
  # Comprueba la cookie de sesión antes de servir la web o la API. Sin sesión: login (o 401 en la API).
  GuardFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub garmin-stats-guard-${AWS::StackName}
      AutoPublish: true
      FunctionConfig:
        Comment: Comprueba la cookie gs_session (HMAC-SHA256)
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        const crypto = require('crypto');
        const SECRET = '${SessionSecret}';
        function b64decode(s) {
          s = s.replace(/-/g, '+').replace(/_/g, '/');
          while (s.length % 4) s += '=';
          return Buffer.from(s, 'base64').toString('utf8');
        }
        // Devuelve el email de una sesión válida (firma y caducidad), o null. Quién tiene acceso lo decide el
        // login (registro de usuarias en S3); aquí solo se comprueba que la sesión la firmó el login.
        function sessionEmail(v) {
          var p = v.split('.');
          if (p.length !== 3) return null;
          if (!(parseInt(p[1], 10) > Date.now() / 1000)) return null;
          var mac = crypto.createHmac('sha256', SECRET).update(p[0] + '.' + p[1]).digest('hex');
          if (mac !== p[2]) return null;
          return b64decode(p[0]).trim().toLowerCase();
        }
        function handler(event) {
          var req = event.request;
          var u = req.uri;
          // Archivos públicos sin datos: instalar la app e icono de la pantalla de inicio
          if (u === '/manifest.webmanifest' || u === '/sw.js' || u.indexOf('/icons/') === 0 || u === '/favicon.ico'
              || u === '/apple-touch-icon.png' || u === '/apple-touch-icon-precomposed.png') return req;
          // Calendario del plan: las apps de calendario no mandan cookie. La dirección lleva un código secreto
          // propio de cada persona que comprueba la API (solo lectura, solo el plan; se puede cambiar o desactivar).
          if (/^\/api\/cal\/[A-Za-z0-9_-]{24,64}\.ics$/.test(u)) return req;
          // Las carpetas de datos de cada persona nunca se piden directamente
          if (u.indexOf('/u/') === 0) return { statusCode: 404, statusDescription: 'Not Found' };
          var c = req.cookies['gs_session'];
          var email = c ? sessionEmail(c.value) : null;
          if (email) {
            // Cada persona solo ve SU carpeta: el id sale del email firmado (HMAC), no de nada que mande el navegador
            var uid = crypto.createHmac('sha256', SECRET).update('uid:' + email).digest('hex').substring(0, 16);
            if (u === '/data.js') req.uri = '/u/' + uid + '/data.js';
            else if (u.indexOf('/acts/') === 0) req.uri = '/u/' + uid + u;
            else if (u.endsWith('/')) req.uri += 'index.html';
            return req;
          }
          if (u.indexOf('/api/') === 0) {
            return { statusCode: 401, statusDescription: 'Unauthorized', headers: { 'cache-control': { value: 'no-store' } } };
          }
          var next = encodeURIComponent(u === '/index.html' ? '/' : u);
          return { statusCode: 302, statusDescription: 'Found',
                   headers: { location: { value: '/auth/login?next=' + next }, 'cache-control': { value: 'no-store' } } };
        }

  # Pasa el dominio público a la Lambda de login (para la dirección de vuelta de Google).
  HostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub garmin-stats-host-${AWS::StackName}
      AutoPublish: true
      FunctionConfig:
        Comment: Copia el Host del visitante en x-viewer-host
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          req.headers['x-viewer-host'] = { value: req.headers.host.value };
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: garmin-stats
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginPath: /site
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: auth
            DomainName: !Select [2, !Split ["/", !GetAtt AuthUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            OriginCustomHeaders: [{ HeaderName: x-origin-verify, HeaderValue: !Ref OriginSecret }]
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
            OriginCustomHeaders: [{ HeaderName: x-origin-verify, HeaderValue: !Ref OriginSecret }]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad            # CachingDisabled
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt GuardFunction.FunctionMetadata.FunctionARN }
        CacheBehaviors:
          - PathPattern: /auth/*
            TargetOriginId: auth
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            FunctionAssociations:
              - { EventType: viewer-request, FunctionARN: !GetAtt HostFunction.FunctionMetadata.FunctionARN }
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - { EventType: viewer-request, FunctionARN: !GetAtt GuardFunction.FunctionMetadata.FunctionARN }

  # ------------------------------------------------------------------ control de gasto
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: garmin-stats-5usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  Url:
    Description: Dirección de la web
    Value: !Sub https://${Distribution.DomainName}
  GoogleRedirectUri:
    Description: URI de redirección autorizada para el cliente OAuth de Google
    Value: !Sub https://${Distribution.DomainName}/auth/callback
  Bucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
