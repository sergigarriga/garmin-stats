[project]
name = "garmin-stats"
version = "0.1.0"
description = "Descarga tus datos de Garmin Connect (Personal API) y genera un análisis a fondo."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fitdecode>=0.10.0",
    "garmin-connect-personal-api-python>=1.0.0",
    "pandas>=2.3",
    "pydantic>=2.14.1",
]

[project.scripts]
garmin-stats = "garmin_stats.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
