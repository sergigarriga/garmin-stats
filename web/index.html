<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Runch</title>
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0F" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Runch" />
    <style>
      /* La web se pinta también bajo la barra de estado (hora, batería): el fondo acompaña al tema. */
      html { background: #F2F5FA; }
      @media (prefers-color-scheme: dark) { html { background: #0E0E0F; } }
      html[data-theme="light"] { background: #F2F5FA; }
      html[data-theme="dark"] { background: #0E0E0F; }
    </style>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Datos generados por `garmin-stats report`. Se recargan solos cada minuto. -->
    <script src="./data.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
